<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autumn & Layla's Art Studio</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #f4f4f9;
            font-family: sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        .toolbar {
            width: 90px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 5px;
            gap: 15px;
            z-index: 10;
        }
        .toolbar h3 {
            margin: 0;
            font-size: 14px;
            text-align: center;
            color: #333;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
        }
        .tool-btn {
            padding: 8px 5px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            background-color: #e0e0e0;
            width: 90%;
            font-weight: bold;
        }
        .tool-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
        }
        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        input[type="range"] {
            width: 80%;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #drawingCanvas { z-index: 1; }
        #overlayCanvas { z-index: 2; pointer-events: none; }
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,0,0,0.05);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Left Toolbar -->
    <div class="toolbar" id="left-tools">
        <h3>Autumn</h3>
        <input type="color" id="color-left" value="#FF1493">
        <input type="range" id="size-left" min="2" max="40" value="8">
        
        <div class="tool-group">
            <button class="tool-btn active" onclick="setMode('left', 'draw')">Draw</button>
            <button class="tool-btn" onclick="setMode('left', 'fill')">Fill</button>
            <button class="tool-btn" onclick="setMode('left', 'copy')">Copy</button>
            <button class="tool-btn" onclick="setMode('left', 'paste')">Paste</button>
        </div>
        <button class="tool-btn" style="margin-top:auto" onclick="clearSide('left')">Clear Left</button>
    </div>

    <!-- Canvas Area -->
    <div id="canvas-container">
        <canvas id="drawingCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div class="divider"></div>
    </div>

    <!-- Right Toolbar -->
    <div class="toolbar" id="right-tools">
        <h3>Layla</h3>
        <input type="color" id="color-right" value="#00BFFF">
        <input type="range" id="size-right" min="2" max="40" value="8">
        
        <div class="tool-group">
            <button class="tool-btn active" onclick="setMode('right', 'draw')">Draw</button>
            <button class="tool-btn" onclick="setMode('right', 'fill')">Fill</button>
            <button class="tool-btn" onclick="setMode('right', 'copy')">Copy</button>
            <button class="tool-btn" onclick="setMode('right', 'paste')">Paste</button>
        </div>
        <button class="tool-btn" style="margin-top:auto" onclick="clearSide('right')">Clear Right</button>
        <button class="tool-btn" onclick="saveArt()">Save Art</button>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlay = document.getElementById('overlayCanvas');
        const overlayCtx = overlay.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Independent state for both sides
        const state = {
            left:  { mode: 'draw', clipboard: null, clipW: 0, clipH: 0 },
            right: { mode: 'draw', clipboard: null, clipW: 0, clipH: 0 }
        };

        const activeTouches = {};

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            overlay.width = container.clientWidth;
            overlay.height = container.clientHeight;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setMode(side, mode) {
            state[side].mode = mode;
            const toolbar = document.getElementById(`${side}-tools`);
            const buttons = toolbar.querySelectorAll('.tool-group .tool-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(buttons).find(b => b.textContent.toLowerCase() === mode);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function getToolSettings(x) {
            const side = x < canvas.width / 2 ? 'left' : 'right';
            return {
                side: side,
                color: document.getElementById(`color-${side}`).value,
                size: document.getElementById(`size-${side}`).value,
                mode: state[side].mode
            };
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                const tools = getToolSettings(x);
                
                activeTouches[touch.identifier] = { x, y, startX: x, startY: y, tools: tools };

                if (tools.mode === 'draw') {
                    ctx.beginPath();
                    ctx.arc(x, y, tools.size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = tools.color;
                    ctx.fill();
                    ctx.beginPath();
                } else if (tools.mode === 'fill') {
                    floodFill(Math.floor(x), Math.floor(y), hexToRgb(tools.color));
                } else if (tools.mode === 'paste' && state[tools.side].clipboard) {
                    ctx.putImageData(state[tools.side].clipboard, x, y);
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();

            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                const touchData = activeTouches[touch.identifier];
                if (!touchData) continue;

                if (touchData.tools.mode === 'draw') {
                    ctx.beginPath();
                    ctx.moveTo(touchData.x, touchData.y);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = touchData.tools.color;
                    ctx.lineWidth = touchData.tools.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                    touchData.x = x;
                    touchData.y = y;
                } else if (touchData.tools.mode === 'copy') {
                    // Draw selection box on overlay
                    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
                    overlayCtx.setLineDash([5, 5]);
                    overlayCtx.strokeStyle = '#000';
                    overlayCtx.lineWidth = 2;
                    overlayCtx.strokeRect(touchData.startX, touchData.startY, x - touchData.startX, y - touchData.startY);
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const touchData = activeTouches[touch.identifier];
                if (!touchData) continue;

                if (touchData.tools.mode === 'copy') {
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    const width = x - touchData.startX;
                    const height = y - touchData.startY;
                    
                    if(Math.abs(width) > 5 && Math.abs(height) > 5) {
                        // Normalize negative dimensions
                        const sx = width < 0 ? x : touchData.startX;
                        const sy = height < 0 ? y : touchData.startY;
                        state[touchData.tools.side].clipboard = ctx.getImageData(sx, sy, Math.abs(width), Math.abs(height));
                    }
                    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
                    setMode(touchData.tools.side, 'paste'); // Auto-switch to paste mode
                }
                delete activeTouches[touch.identifier];
            }
        });

        // --- Utility Functions ---
        
        function clearSide(side) {
            const width = canvas.width / 2;
            const xOffset = side === 'left' ? 0 : width;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(xOffset, 0, width, canvas.height);
        }

        function saveArt() {
            const link = document.createElement('a');
            link.download = 'our-masterpiece.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            return [ (bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255, 255 ];
        }

        // Fast Scanline Flood Fill
        function floodFill(startX, startY, fillColor) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width;
            const h = canvas.height;
            const startPos = (startY * w + startX) * 4;
            const startColor = [data[startPos], data[startPos+1], data[startPos+2], data[startPos+3]];
            
            if (startColor[0] === fillColor[0] && startColor[1] === fillColor[1] && startColor[2] === fillColor[2]) return;

            const matchColor = (pos) => data[pos] === startColor[0] && data[pos+1] === startColor[1] && data[pos+2] === startColor[2];
            const colorPixel = (pos) => {
                data[pos] = fillColor[0]; data[pos+1] = fillColor[1]; data[pos+2] = fillColor[2]; data[pos+3] = 255;
            };

            const stack = [[startX, startY]];
            while (stack.length) {
                let [x, y] = stack.pop();
                let pos = (y * w + x) * 4;
                while (y >= 0 && matchColor(pos)) { y--; pos -= w * 4; }
                pos += w * 4; y++;
                let reachLeft = false; let reachRight = false;
                while (y < h && matchColor(pos)) {
                    colorPixel(pos);
                    if (x > 0) {
                        if (matchColor(pos - 4)) { if (!reachLeft) { stack.push([x - 1, y]); reachLeft = true; } }
                        else if (reachLeft) reachLeft = false;
                    }
                    if (x < w - 1) {
                        if (matchColor(pos + 4)) { if (!reachRight) { stack.push([x + 1, y]); reachRight = true; } }
                        else if (reachRight) reachRight = false;
                    }
                    y++; pos += w * 4;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
