<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autumn & Layla's Art Studio</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #f4f4f9;
            font-family: sans-serif;
            touch-action: none; /* Critical for pointer events to prevent scrolling */
            overflow: hidden;
        }
        .toolbar {
            width: 90px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 5px;
            gap: 15px;
            z-index: 10;
        }
        .toolbar h3 {
            margin: 0;
            font-size: 14px;
            text-align: center;
            color: #333;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
        }
        .tool-btn {
            padding: 8px 5px;
            font-size: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            background-color: #e0e0e0;
            width: 90%;
            font-weight: bold;
        }
        .tool-btn.active {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
        }
        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        input[type="range"] {
            width: 80%;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #drawingCanvas { z-index: 1; }
        #overlayCanvas { z-index: 2; pointer-events: none; }
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0,0,0,0.05);
            z-index: 3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Left Toolbar -->
    <div class="toolbar" id="left-tools">
        <h3>Autumn</h3>
        <input type="color" id="color-left" value="#FF1493">
        <input type="range" id="size-left" min="2" max="40" value="8">
        
        <div class="tool-group">
            <button class="tool-btn active" onclick="setMode('left', 'draw')">Draw</button>
            <button class="tool-btn" onclick="setMode('left', 'fill')">Fill</button>
            <button class="tool-btn" onclick="setMode('left', 'copy')">Copy</button>
            <button class="tool-btn" onclick="setMode('left', 'paste')">Paste</button>
        </div>
        <button class="tool-btn" style="margin-top:auto" onclick="undo()">Undo</button>
        <button class="tool-btn" onclick="clearSide('left')">Clear Left</button>
    </div>

    <!-- Canvas Area -->
    <div id="canvas-container">
        <canvas id="drawingCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div class="divider"></div>
    </div>

    <!-- Right Toolbar -->
    <div class="toolbar" id="right-tools">
        <h3>Layla</h3>
        <input type="color" id="color-right" value="#00BFFF">
        <input type="range" id="size-right" min="2" max="40" value="8">
        
        <div class="tool-group">
            <button class="tool-btn active" onclick="setMode('right', 'draw')">Draw</button>
            <button class="tool-btn" onclick="setMode('right', 'fill')">Fill</button>
            <button class="tool-btn" onclick="setMode('right', 'copy')">Copy</button>
            <button class="tool-btn" onclick="setMode('right', 'paste')">Paste</button>
        </div>
        <button class="tool-btn" style="margin-top:auto" onclick="undo()">Undo</button>
        <button class="tool-btn" onclick="clearSide('right')">Clear Right</button>
        <button class="tool-btn" onclick="saveArt()">Save Art</button>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlay = document.getElementById('overlayCanvas');
        const overlayCtx = overlay.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Independent state for tools
        const state = {
            left:  { mode: 'draw', clipboard: null },
            right: { mode: 'draw', clipboard: null }
        };

        // Undo History State
        let history = [];
        let historyStep = -1;

        const activePointers = {};

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            overlay.width = container.clientWidth;
            overlay.height = container.clientHeight;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState(); // Save the initial blank canvas
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function saveState() {
            // Remove any "future" history if they hit undo then draw again
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            // Save current frame
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            // Keep maximum 15 undo steps to save memory
            if (history.length > 15) {
                history.shift();
            } else {
                historyStep++;
            }
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                ctx.putImageData(history[historyStep], 0, 0);
            }
        }

        function setMode(side, mode) {
            state[side].mode = mode;
            const toolbar = document.getElementById(`${side}-tools`);
            const buttons = toolbar.querySelectorAll('.tool-group .tool-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(buttons).find(b => b.textContent.toLowerCase() === mode);
            if(activeBtn) activeBtn.classList.add('active');
        }

        function getToolSettings(x) {
            const side = x < canvas.width / 2 ? 'left' : 'right';
            return {
                side: side,
                color: document.getElementById(`color-${side}`).value,
                size: document.getElementById(`size-${side}`).value,
                mode: state[side].mode
            };
        }

        // POINTER EVENTS - Works for Mouse, Touch, and Stylus
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const tools = getToolSettings(x);
            
            activePointers[e.pointerId] = { x, y, startX: x, startY: y, tools: tools, hasDrawn: false };

            if (tools.mode === 'draw') {
                activePointers[e.pointerId].hasDrawn = true;
                ctx.beginPath();
                ctx.arc(x, y, tools.size / 2, 0, Math.PI * 2);
                ctx.fillStyle = tools.color;
                ctx.fill();
                ctx.beginPath();
            } else if (tools.mode === 'fill') {
                floodFill(Math.floor(x), Math.floor(y), hexToRgb(tools.color));
                saveState();
            } else if (tools.mode === 'paste' && state[tools.side].clipboard) {
                const clip = state[tools.side].clipboard;
                // Center the paste precisely on where they tap
                ctx.putImageData(clip, x - (clip.width / 2), y - (clip.height / 2));
                saveState();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            const pointerData = activePointers[e.pointerId];
            if (!pointerData) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (pointerData.tools.mode === 'draw') {
                ctx.beginPath();
                ctx.moveTo(pointerData.x, pointerData.y);
                ctx.lineTo(x, y);
                ctx.strokeStyle = pointerData.tools.color;
                ctx.lineWidth = pointerData.tools.size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                pointerData.x = x;
                pointerData.y = y;
            } else if (pointerData.tools.mode === 'copy') {
                // Draw dotted selection box on overlay
                overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
                overlayCtx.setLineDash([5, 5]);
                overlayCtx.strokeStyle = '#000';
                overlayCtx.lineWidth = 2;
                overlayCtx.strokeRect(pointerData.startX, pointerData.startY, x - pointerData.startX, y - pointerData.startY);
            }
        });

        function endPointer(e) {
            const pointerData = activePointers[e.pointerId];
            if (!pointerData) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (pointerData.tools.mode === 'copy') {
                const width = x - pointerData.startX;
                const height = y - pointerData.startY;
                
                // Only copy if they dragged a box larger than 5 pixels
                if(Math.abs(width) > 5 && Math.abs(height) > 5) {
                    const sx = width < 0 ? x : pointerData.startX;
                    const sy = height < 0 ? y : pointerData.startY;
                    state[pointerData.tools.side].clipboard = ctx.getImageData(sx, sy, Math.abs(width), Math.abs(height));
                    setMode(pointerData.tools.side, 'paste'); // Auto-switch to paste
                }
                overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
            } else if (pointerData.tools.mode === 'draw' && pointerData.hasDrawn) {
                saveState(); // Save state after finishing a drawing stroke
            }
            
            delete activePointers[e.pointerId];
        }

        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);
        canvas.addEventListener('pointerout', endPointer);

        // --- Utility Functions ---
        
        function clearSide(side) {
            const width = canvas.width / 2;
            const xOffset = side === 'left' ? 0 : width;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(xOffset, 0, width, canvas.height);
            saveState();
        }

        function saveArt() {
            const link = document.createElement('a');
            link.download = 'our-masterpiece.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            return [ (bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255, 255 ];
        }

        // Scanline Flood Fill
        function floodFill(startX, startY, fillColor) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width;
            const h = canvas.height;
            const startPos = (startY * w + startX) * 4;
            const startColor = [data[startPos], data[startPos+1], data[startPos+2], data[startPos+3]];
            
            if (startColor[0] === fillColor[0] && startColor[1] === fillColor[1] && startColor[2] === fillColor[2]) return;

            const matchColor = (pos) => data[pos] === startColor[0] && data[pos+1] === startColor[1] && data[pos+2] === startColor[2];
            const colorPixel = (pos) => {
                data[pos] = fillColor[0]; data[pos+1] = fillColor[1]; data[pos+2] = fillColor[2]; data[pos+3] = 255;
            };

            const stack = [[startX, startY]];
            while (stack.length) {
                let [x, y] = stack.pop();
                let pos = (y * w + x) * 4;
                while (y >= 0 && matchColor(pos)) { y--; pos -= w * 4; }
                pos += w * 4; y++;
                let reachLeft = false; let reachRight = false;
                while (y < h && matchColor(pos)) {
                    colorPixel(pos);
                    if (x > 0) {
                        if (matchColor(pos - 4)) { if (!reachLeft) { stack.push([x - 1, y]); reachLeft = true; } }
                        else if (reachLeft) reachLeft = false;
                    }
                    if (x < w - 1) {
                        if (matchColor(pos + 4)) { if (!reachRight) { stack.push([x + 1, y]); reachRight = true; } }
                        else if (reachRight) reachRight = false;
                    }
                    y++; pos += w * 4;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
